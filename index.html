<!DOCTYPE html>
<html>
<head>
  <title>SMS Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* UI STYLES */
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 28px 16px; background: #fff; }
    .card { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .title { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
    .sub { font-size: 16px; margin: 0 0 6px; text-align:left; }
    .sub strong { font-weight: 800; }
    .btn { display:inline-block; padding:18px 34px; margin-top:16px; background:#28a745; color:#fff; text-decoration:none; border-radius:12px; font-size:20px; font-weight:800; border:none; cursor:pointer; width: 100%; box-sizing: border-box;}
    .btnSecondary { display:inline-block; padding:14px 22px; margin-top:10px; background:#111; color:#fff; text-decoration:none; border-radius:12px; font-size:15px; font-weight:800; }
    .debug { margin-top:16px; font-size:12px; color:#222; word-break:break-all; text-align:left; background:#f7f7f7; padding:14px; border-radius:12px; white-space:pre-wrap; border:1px solid #eee; }
    .hint { margin-top:10px; font-size:12px; color:#666; text-align:left; line-height:1.35; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#eee; font-size:12px; font-weight:700; margin-bottom:10px; }

    /* LABEL PREVIEW */
    .labelPreview { margin-top: 8px; text-align: left; }
    .labelRow { border: 1px solid #eee; border-radius: 12px; padding: 12px 12px; margin-top: 10px; background: #fff; position: relative; overflow: hidden; }
    .labelRow.sendout::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #000; }
    .labelMetaTop { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .labelTag { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background:#f2f2f2; }
    .labelTag.so { background:#000; color:#fff; }
    .labelTag.ih { background:#e9f7ee; color:#1f7a39; border:1px solid #bfe8cc; }
    .barcodeLine { font-size: 16px; font-weight: 900; letter-spacing: 0.3px; }
    .testsLine { margin-top: 6px; font-size: 13px; color:#111; }
    .mutedSmall { font-size: 12px; color:#666; font-weight: 700; }
  </style>
</head>

<body>
<div class="card">
  <div class="pill" id="platformPill">Detecting platform…</div>
  <div class="title">✅ Verify Before Printing</div>

  <div class="sub"><strong>Name:</strong> <span id="patientName">—</span></div>
  <div class="sub"><strong>DOB:</strong> <span id="patientDob">—</span></div>

  <div class="sub"><strong>Will print:</strong></div>
  <div id="labelPreview" class="labelPreview">—</div>

  <div class="sub"><strong>Total labels:</strong> <span id="totalLabels">—</span></div>

  <button id="printBtn" class="btn">Print Labels</button><br>
  <a id="backBtn" class="btnSecondary" href="#" style="display:none;">Back to Asana & Close Tab</a>

  <div class="hint" id="hintText"></div>
  <div id="debugText" class="debug">System Ready.</div>
</div>

<script>
/* ============================
   Your Exact ZPL Generator
============================ */
function buildSingleLabelZpl(name, dob, barcode, qty, labelType, testsText, sampleType) {
  qty = parseInt(qty || "1", 10);
  if (!qty || qty < 1) qty = 1;
  const isSO = String(labelType || "").toUpperCase().trim() === "SO";
  const Border = isSO ? 15 : 0;
  return `^XA^MMT^MNM^PR6^MD30^FO0,10^GB385,${Border},${Border}^FS^FO20,25^A0N,32,32^FD${name.trim()}^FS^FO20,55^A0N,28,28^FD${dob.trim()}^FS^FO20,78^BY2,2,80^BCN,80,Y,N,N^FD${barcode.trim()}^FS^FO12,180^A0N,20,20^FD${sampleType.trim()}^FS^FO12,200^A0N,20,20^FB350,2,0,L,0^FD${testsText.trim()}^FS^PQ${qty},0,1,Y^XZ\r\n`;
}

/* ============================
   Platform Detection
============================ */
const isIOS = () => (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
const isAndroid = () => /Android/i.test(navigator.userAgent);
const isWindows = () => /Win/.test(navigator.platform);

/* ============================
   Windows: Web Serial API (Direct ZPL)
============================ */
async function printViaSerial(zplData) {
  try {
    // 1. Prompts the user to select the Bluetooth/USB COM Port
    const port = await navigator.serial.requestPort();
    
    // 2. Open connection to the printer
    await port.open({ baudRate: 9600 });
    
    // 3. Convert ZPL string to raw bytes
    const encoder = new TextEncoder();
    const data = encoder.encode(zplData);
    
    // 4. Send directly to printer
    const writer = port.writable.getWriter();
    await writer.write(data);
    writer.releaseLock();
    
    // 5. Close connection
    await port.close();
    
    document.getElementById("debugText").innerText = "✅ SUCCESS: Raw ZPL sent to printer.";
  } catch (err) {
    console.error("Serial Error:", err);
    document.getElementById("debugText").innerText = "❌ ERROR: " + err.message + "\n\n(Make sure your Bluetooth printer is paired to Windows and you select the correct COM port).";
  }
}

/* ============================
   Main Application
============================ */
let finalZpl = "";

function init() {
  const platform = isIOS() ? "iOS" : (isAndroid() ? "Android" : "Windows");
  document.getElementById("platformPill").innerText = platform;

  // Read URL Params
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const name = decodeURIComponent(params.get("name") || "");
  const dob = decodeURIComponent(params.get("dob") || "");
  const items = decodeURIComponent(params.get("items") || "").split("|");
  const labels = decodeURIComponent(params.get("label") || "").split("|");
  const tests = decodeURIComponent(params.get("tests") || "").split("|");
  const st = decodeURIComponent(params.get("st") || "").split("|");
  const cb = params.get("cb") || "asana://";

  if (!name || items.length === 0 || !items[0]) {
    document.getElementById("debugText").innerText = "Waiting for valid patient data...";
    return;
  }

  document.getElementById("patientName").innerText = name;
  document.getElementById("patientDob").innerText = dob;

  let uiHtml = "";
  finalZpl = "";
  let totalQty = 0;

  items.forEach((item, i) => {
    if (!item) return;
    let [bc, qty] = item.split("*");
    qty = parseInt(qty) || 1;
    totalQty += qty;
    const lbl = labels[i] || "";
    const testTxt = tests[i] || "";
    const stTxt = st[i] || "";

    const isSO = lbl.toUpperCase() === "SO";

    // Build UI
    uiHtml += `
      <div class="labelRow ${isSO ? 'sendout' : ''}">
        <div class="labelMetaTop">
          <span class="labelTag ${isSO ? 'so' : 'ih'}">${isSO ? 'SO' : 'IH'}</span>
          <span class="mutedSmall">Label ${i+1}</span>
        </div>
        <div class="barcodeLine">${bc} <span class="mutedSmall">x${qty}</span></div>
        <div class="testsLine">${stTxt} - ${testTxt}</div>
      </div>
    `;

    // Build ZPL
    finalZpl += buildSingleLabelZpl(name, dob, bc, qty, lbl, testTxt, stTxt);
  });

  document.getElementById("labelPreview").innerHTML = uiHtml;
  document.getElementById("totalLabels").innerText = totalQty;

  const btn = document.getElementById("printBtn");

  // Setup Button Actions
  if (isWindows()) {
    document.getElementById("hintText").innerText = "Windows: Uses Web Serial API. When you click print, select your Bluetooth COM Port.";
    btn.onclick = () => {
      // Chrome requires Web Serial to be triggered by a user click
      printViaSerial(finalZpl); 
    };
  } else if (isAndroid()) {
    btn.innerText = "Tap to Print (Android)";
    const btoaSafe = btoa(finalZpl.replace(/[^\x00-\x7F]/g, "")).replace(/=/g, "_");
    btn.onclick = () => {
      window.location.href = `intent://x-callback-url/zplcode?code=${encodeURIComponent(btoaSafe)}&x-success=${encodeURIComponent(cb)}#Intent;scheme=arrowhead;package=com.mobiprintpro.retail.android;end`;
      setTimeout(() => { window.location.href = "intent://#Intent;scheme=asana;package=com.asana.app;end"; }, 3000);
    };
    document.getElementById("backBtn").style.display = "inline-block";
  } else if (isIOS()) {
    btn.innerText = "Tap to Print (iOS)";
    btn.onclick = () => {
      window.location.href = "shortcuts://run-shortcut?name=SMS%20Print&input=text&text=" + encodeURIComponent(window.location.hash.substring(1));
    };
  }
}

window.onload = init;
</script>
</body>
</html>
