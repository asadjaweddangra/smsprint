<!DOCTYPE html>
<html>
<head>
  <title>Printing...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; }
    .btn { display:none; padding: 20px 40px; margin-top: 30px; background: #28a745; color: white; text-decoration: none; border-radius: 8px; font-size: 20px; font-weight: bold; }
    .debug { margin-top:20px; font-size: 12px; color: #333; word-break: break-all; text-align:left; background:#f7f7f7; padding:15px; border-radius:8px; white-space: pre-wrap;}
    .hint { margin-top:10px; font-size: 13px; color:#666; }
  </style>
</head>
<body>

<h3 id="statusTitle">🔄 Processing...</h3>
<a id="printBtn" href="#" class="btn">Tap to Print</a>
<div id="hintText" class="hint"></div>
<div id="debugText" class="debug">Initializing...</div>

<script>
function getParamFromHash(key) {
  let hash = window.location.hash.substring(1);
  let params = new URLSearchParams(hash);
  return params.get(key) || "";
}

function sanitizeZpl(zpl) {
  zpl = zpl.replace(/^\uFEFF/, "");
  zpl = zpl.replace(/\u00A0/g, " ");
  zpl = zpl.replace(/[^\x00-\x7F]/g, "");
  return zpl.trim();
}

function buildSingleLabelZpl(name, dob, barcode, qty) {
  qty = parseInt(qty || "1", 10);
  if (!qty || qty < 1) qty = 1;

  let zpl = `^XA
^PW406
^LL300
^FO20,20^A0N,32,32^FD${name}^FS
^FO20,60^A0N,28,28^FDDOB: ${dob}^FS
^FO20,110^BY2,2,80^BCN,80,Y,N,N^FD${barcode}^FS`;

  if (qty > 1) zpl += `\n^PQ${qty},0,1,Y`;
  zpl += `\n^XZ`;
  return zpl;
}

function parseItems(itemsStr) {
  let decoded = decodeURIComponent(itemsStr || "").trim();
  if (!decoded) return [];
  return decoded.split("|").map(part => {
    let [barcode, qty] = part.split("*");
    barcode = (barcode || "").trim();
    qty = (qty || "1").trim();
    if (!barcode) return null;
    return { barcode, qty };
  }).filter(Boolean);
}

let fallbackBtnTimer, mobiprintTimer;

function showFallback(deepLink) {
  const btn = document.getElementById("printBtn");
  btn.href = deepLink;
  btn.style.display = "inline-block";
  document.getElementById("statusTitle").innerText = "⚠️ Tap to Print";
  document.getElementById("hintText").innerText =
    "If printing didn’t open automatically, tap the button.";
}

function process() {
  if (fallbackBtnTimer) clearTimeout(fallbackBtnTimer);
  if (mobiprintTimer) clearTimeout(mobiprintTimer);

  document.getElementById("printBtn").style.display = "none";
  document.getElementById("hintText").innerText = "";
  document.getElementById("statusTitle").innerText = "🔄 Processing...";

  let name = getParamFromHash("name");
  let dob = getParamFromHash("dob");
  let itemsStr = getParamFromHash("items");
  let cb = getParamFromHash("cb") || "asana://";

  if (!name || !dob || !itemsStr) {
    document.getElementById("statusTitle").innerText = "❌ Missing Data";
    document.getElementById("debugText").innerText =
      "Provide:\n#name=...&dob=...&items=111*1|222*3&cb=asana://";
    return;
  }

  let decodedName = decodeURIComponent(name);
  let decodedDob = decodeURIComponent(dob);
  let items = parseItems(itemsStr);

  let finalZpl = items.map(item =>
    buildSingleLabelZpl(decodedName, decodedDob, item.barcode, item.qty)
  ).join("\r\n") + "\r\n";

  finalZpl = sanitizeZpl(finalZpl) + "\r\n";
  let base64Zpl = btoa(finalZpl);

  let mobiprintDeepLink =
    "arrowhead://x-callback-url/zplcode" +
    "?code=" + encodeURIComponent(base64Zpl) +
    "&x-success=" + encodeURIComponent(cb) +
    "&x-error=" + encodeURIComponent(cb) +
    "&x-cancel=" + encodeURIComponent(cb);

  // Build Shortcut URL (payload = your same query string)
  let payload = `name=${encodeURIComponent(decodedName)}&dob=${encodeURIComponent(decodedDob)}&items=${encodeURIComponent(decodeURIComponent(itemsStr))}&cb=${encodeURIComponent(cb)}`;

  let shortcutURL =
    "shortcuts://run-shortcut" +
    "?name=" + encodeURIComponent("SMS Print") +
    "&input=text" +
    "&text=" + encodeURIComponent(payload);

  document.getElementById("debugText").innerText =
    "✅ Shortcut URL:\n" + shortcutURL + "\n\n" +
    "✅ Mobiprint URL:\n" + mobiprintDeepLink;

  document.getElementById("statusTitle").innerText = "🚀 Launching...";

  // 1) Try Shortcut first
  setTimeout(() => {
    window.location.href = shortcutURL;
  }, 150);

  // 2) If Shortcut didn't open, try Mobiprint
  mobiprintTimer = setTimeout(() => {
    window.location.href = mobiprintDeepLink;
  }, 900);

  // 3) If Mobiprint didn't open, show fallback button
  fallbackBtnTimer = setTimeout(() => {
    showFallback(mobiprintDeepLink);
  }, 1400);

  // 4) Clear PHI from address bar
  setTimeout(() => {
    history.replaceState(null, "", window.location.pathname);
  }, 1800);
}

window.onload = process;
window.onhashchange = process;
</script>

</body>
</html>
