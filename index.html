<!DOCTYPE html>
<html>
<head>
  <title>Specimen Collection Workflow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px 16px; background: #f4f7f6; color: #111; }
    .card { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    
    /* State Visibility */
    #printView { display: block; }
    #confirmView { display: none; }

    .title { font-size: 22px; font-weight: 800; margin-bottom: 15px; }
    .patient-box { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: left; margin-bottom: 20px; border-left: 5px solid #007bff; }
    
    .labelRow { border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-top: 10px; text-align: left; position: relative; }
    .labelRow.sendout { border-top: 8px solid #000; }
    
    .btn { display: block; width: 100%; padding: 18px; margin-top: 12px; border-radius: 12px; font-size: 18px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; box-sizing: border-box; }
    .btn-print { background: #007bff; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-warn { background: #ffc107; color: #111; }
    .btn-danger { background: #dc3545; color: white; }
    
    .debug { margin-top: 20px; font-size: 11px; color: #888; text-align: left; background: #eee; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="card">
  <div id="printView">
    <div class="title">1. Print Labels</div>
    <div class="patient-box">
      <strong>Patient:</strong> <span id="name">—</span><br>
      <strong>DOB:</strong> <span id="dob">—</span>
    </div>
    <div id="labelPreview"></div>
    <button id="printBtn" class="btn btn-print">🖨️ Print Labels</button>
  </div>

  <div id="confirmView">
    <div class="title">2. Collection Status</div>
    <p>Labels printed. Verify and attach to tubes before confirming collection.</p>
    
    <button onclick="handleOutcome('SUCCESS')" class="btn btn-success">✅ Yes, Collection Complete</button>
    <button onclick="handleOutcome('HANDWRITE')" class="btn btn-warn">✍️ Printer Failed (Hand-wrote)</button>
    <button onclick="handleOutcome('REFUSED')" class="btn btn-danger">❌ Unable to Draw / Refused</button>
  </div>

  <div id="debug" class="debug">System Ready.</div>
</div>

<script>
/* ============================
   CONFIG & UTILS
============================ */
// Switch to "ARROWHEAD" for direct Android intent, or "SHORTCUT" for MobiPrint-via-Shortcut
const ANDROID_MODE = "ARROWHEAD"; 

const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/i.test(navigator.userAgent);
const isWindows = () => /Win/.test(navigator.platform);

let patientData = {};

/* ============================
   WORKFLOW LOGIC
============================ */
function init() {
    const params = new URLSearchParams(window.location.hash.substring(1));
    patientData = {
        name: params.get("name") || "",
        dob: params.get("dob") || "",
        items: params.get("items") || "",
        label: params.get("label") || "",
        tests: params.get("tests") || "",
        st: params.get("st") || "",
        cb: params.get("cb") || "asana://"
    };

    if(!patientData.name) return;

    document.getElementById("name").innerText = patientData.name;
    document.getElementById("dob").innerText = patientData.dob;
    
    // Render simplified preview
    const items = patientData.items.split("|");
    let html = "";
    items.forEach(it => {
        if(!it) return;
        const [bc, qty] = it.split("*");
        html += `<div class="labelRow"><small>Tube:</small> <strong>${bc}</strong> (x${qty})</div>`;
    });
    document.getElementById("labelPreview").innerHTML = html;

    // Set Print Action
    document.getElementById("printBtn").onclick = () => {
        executePrint();
        // Shift UI to Confirmation View
        document.getElementById("printView").style.display = "none";
        document.getElementById("confirmView").style.display = "block";
    };
}

function executePrint() {
    const zpl = buildFullZpl();
    
    if (isWindows()) {
        printViaSerial(zpl);
    } else if (isAndroid()) {
        if (ANDROID_MODE === "ARROWHEAD") {
            const b64 = btoa(zpl).replace(/=/g, "_");
            window.location.href = `intent://x-callback-url/zplcode?code=${b64}#Intent;scheme=arrowhead;package=com.mobiprintpro.retail.android;end`;
        } else {
            // Android uses Shortcut-style if needed
            window.location.href = `shortcuts://run-shortcut?name=SMS-Print&text=${encodeURIComponent(window.location.hash)}`;
        }
    } else if (isIOS()) {
        window.location.href = `shortcuts://run-shortcut?name=SMS-Print&text=${encodeURIComponent(window.location.hash)}`;
    }
}

function handleOutcome(status) {
    let finalUrl = patientData.cb;
    
    switch(status) {
        case 'SUCCESS':
            alert("Collection Logged. Completing Task...");
            // Asana callbacks usually require specific URL structures to complete tasks
            // This assumes the callback provided in 'cb' is the direct route
            window.location.href = finalUrl;
            break;
            
        case 'HANDWRITE':
            alert("Logging as Handwritten...");
            // Append a comment parameter if your middleware supports it
            window.location.href = finalUrl + "?comment=Handwritten-No-Label";
            break;
            
        case 'REFUSED':
            alert("Logging Refusal. Task will remain open.");
            // We just return to Asana without the 'complete' trigger if possible
            window.location.href = "asana://"; 
            break;
    }
}

/* ============================
   ZPL GENERATOR (Windows/Android)
============================ */
function buildFullZpl() {
    const items = patientData.items.split("|");
    const labels = patientData.label.split("|");
    const tests = patientData.tests.split("|");
    const st = patientData.st.split("|");
    
    let totalZpl = "";
    items.forEach((item, i) => {
        if(!item) return;
        let [bc, qty] = item.split("*");
        const isSO = (labels[i] || "").toUpperCase() === "SO" ? 15 : 0;
        
        totalZpl += `^XA^MMT^MNM^PR6^MD30^FO0,10^GB385,${isSO},${isSO}^FS`;
        totalZpl += `^FO20,25^A0N,32,32^FD${patientData.name}^FS`;
        totalZpl += `^FO20,55^A0N,28,28^FD${patientData.dob}^FS`;
        totalZpl += `^FO20,78^BY2,2,80^BCN,80,Y,N,N^FD${bc}^FS`;
        totalZpl += `^FO12,180^A0N,20,20^FD${st[i]||""}^FS`;
        totalZpl += `^FO12,200^A0N,20,20^FB350,2,0,L,0^FD${tests[i]||""}^FS`;
        totalZpl += `^PQ${qty},0,1,Y^XZ\r\n`;
    });
    return totalZpl;
}

async function printViaSerial(zpl) {
    try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        const writer = port.writable.getWriter();
        await writer.write(new TextEncoder().encode(zpl));
        writer.releaseLock();
        await port.close();
    } catch (e) { document.getElementById("debug").innerText = e.message; }
}

window.onload = init;
</script>
</body>
</html>
