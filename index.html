<!DOCTYPE html>
<html>
<head>
  <title>SMS Print (Shortcut)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 28px 16px; background: #fff; }
    .card { max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .title { font-size: 20px; font-weight: 800; margin: 0 0 6px; }
    .sub { font-size: 16px; margin: 0 0 4px; }
    .sub strong { font-weight: 800; }

    .btn {
      display: inline-block;
      padding: 18px 34px;
      margin-top: 18px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
    }
    .btn:active { transform: scale(0.99); }

    .hint { margin-top: 10px; font-size: 13px; color: #666; line-height: 1.35; }
    .debug {
      margin-top: 16px;
      font-size: 12px;
      color: #222;
      word-break: break-all;
      text-align: left;
      background: #f7f7f7;
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      border: 1px solid #eee;
    }
    .warn {
      margin-top: 12px;
      font-size: 13px;
      color: #b00020;
      font-weight: 700;
      line-height: 1.35;
    }
    .ok {
      margin-top: 10px;
      font-size: 13px;
      color: #0a7a2f;
      font-weight: 700;
      line-height: 1.35;
    }
  </style>
</head>

<body>

<div class="card">
  <div class="title">✅ Verify Before Printing</div>

  <p class="sub"><strong>Name:</strong> <span id="patientName">—</span></p>
  <p class="sub"><strong>DOB:</strong> <span id="patientDob">—</span></p>
  <p class="sub"><strong>Labels:</strong> <span id="labelCount">—</span></p>

  <!-- IMPORTANT: Let href do the navigation (fastest) -->
  <a id="runShortcutBtn" href="#" class="btn">Run Shortcut & Print</a>

  <div class="hint" id="hintText">
    This opens the iOS Shortcut named <b>SMS Print</b>. The Shortcut will print and return to Asana.
  </div>

  <div class="ok" id="readyText" style="display:none;">
    ✅ Ready. Tap “Run Shortcut & Print”.
  </div>

  <div class="warn" id="warnText" style="display:none;">
    ⚠️ Shortcut-only mode: if the shortcut is not installed, printing will not run.
  </div>

  <div id="debugText" class="debug">Initializing...</div>
</div>

<script>
/* ============================
   Helpers
============================ */

function getParamFromHash(key) {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get(key) || "";
}

/**
 * items format:
 * items=BARCODE*QTY|BARCODE*QTY|BARCODE
 */
function parseItems(itemsStr) {
  const decoded = decodeURIComponent(itemsStr || "").trim();
  if (!decoded) return [];

  return decoded.split("|").map(part => {
    let [barcode, qty] = part.split("*");
    barcode = (barcode || "").trim();
    qty = (qty || "1").trim();
    if (!barcode) return null;
    return { barcode, qty };
  }).filter(Boolean);
}

/* ============================
   Build Shortcut URL (once on load / hashchange)
============================ */

let shortcutURL = "";
let callbackUrl = "asana://";
let patientName = "";
let patientDob = "";
let lastPayload = "";

function buildShortcutURLFromHash() {
  // Reset UI
  document.getElementById("readyText").style.display = "none";
  document.getElementById("warnText").style.display = "none";
  document.getElementById("debugText").innerText = "Processing hash...";
  document.getElementById("runShortcutBtn").href = "#";

  callbackUrl = getParamFromHash("cb") || "asana://";
  const nameParam = getParamFromHash("name");
  const dobParam  = getParamFromHash("dob");
  const itemsParam = getParamFromHash("items");

  if (!nameParam || !dobParam || !itemsParam) {
    document.getElementById("debugText").innerText =
      "❌ Missing required parameters.\n\n" +
      "Expected hash format:\n" +
      "#name=...&dob=...&items=111*1|222*3|333*2&cb=asana://\n\n" +
      "Example:\n" +
      "#name=TEST%20PATIENT%20A&dob=02%2F02%2F1992&items=1111111111*1%7C2222222222*3%7C3333333333*2&cb=asana://";
    return false;
  }

  patientName = decodeURIComponent(nameParam);
  patientDob  = decodeURIComponent(dobParam);
  const items = parseItems(itemsParam);

  if (!items.length) {
    document.getElementById("debugText").innerText =
      "❌ items parameter invalid or empty.\n\n" +
      "Valid example:\nitems=1111111111*1|2222222222*3|3333333333*2";
    return false;
  }

  // Display verification
  document.getElementById("patientName").innerText = patientName;
  document.getElementById("patientDob").innerText = patientDob;

  // Display label count details
  const totalLabels = items.reduce((sum, it) => {
    const q = parseInt(it.qty || "1", 10) || 1;
    return sum + Math.max(1, q);
  }, 0);

  // Make a human-readable list (for tech verification)
  const lines = items.map((it, idx) => {
    const q = parseInt(it.qty || "1", 10) || 1;
    return `${idx+1}) ${it.barcode}  x${Math.max(1,q)}`;
  }).join("\n");

  document.getElementById("labelCount").innerText =
    `${items.length} barcode(s) / ${totalLabels} label(s) total`;

  // Payload passed to Shortcut
  const itemsDecoded = decodeURIComponent(itemsParam);

  const payload =
    `name=${encodeURIComponent(patientName)}` +
    `&dob=${encodeURIComponent(patientDob)}` +
    `&items=${encodeURIComponent(itemsDecoded)}` +
    `&cb=${encodeURIComponent(callbackUrl)}`;

  lastPayload = decodeURIComponent(payload);

  // Shortcut must exist with this exact name
  const shortcutName = "SMS Print";

  shortcutURL =
    "shortcuts://run-shortcut" +
    "?name=" + encodeURIComponent(shortcutName) +
    "&input=text" +
    "&text=" + encodeURIComponent(payload);

  // IMPORTANT: Let href handle navigation for fastest launch
  document.getElementById("runShortcutBtn").href = shortcutURL;

  // Debug output
  document.getElementById("debugText").innerText =
    "✅ Shortcut-only mode (NO web fallback)\n\n" +
    "Shortcut name: " + shortcutName + "\n" +
    "Callback (handled by Shortcut): " + callbackUrl + "\n\n" +
    "✅ Will print:\n" + lines + "\n\n" +
    "✅ Payload passed to Shortcut:\n" + lastPayload + "\n\n" +
    "✅ Shortcut URL:\n" + shortcutURL;

  document.getElementById("readyText").style.display = "block";
  document.getElementById("warnText").style.display = "block";
  return true;
}

/* ============================
   Click behavior
   - DO NOT preventDefault (href must execute immediately)
   - Clear PHI quickly for privacy
   - Do NOT return to Asana (Shortcut does that)
============================ */

function onClickShortcutButton() {
  // Clear PHI from address bar soon after tap
  setTimeout(() => {
    history.replaceState(null, "", window.location.pathname);
  }, 400);

  // Optional: update debug for click confirmation
  setTimeout(() => {
    document.getElementById("debugText").innerText += "\n\n✅ Tap registered. Launching Shortcut...";
  }, 50);
}

/* ============================
   Init
============================ */

function init() {
  buildShortcutURLFromHash();

  // Attach click handler (but do not block navigation)
  const btn = document.getElementById("runShortcutBtn");
  btn.onclick = onClickShortcutButton;
}

// Run on load AND on hash change so new links update in already-open Safari tab
window.onload = init;
window.onhashchange = init;
</script>

</body>
</html>
