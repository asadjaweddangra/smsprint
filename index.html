<!DOCTYPE html>
<html>
<head>
  <title>SMS Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 28px 16px; background: #fff; }
    .card { max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .title { font-size: 20px; font-weight: 800; margin: 0 0 6px; }
    .sub { font-size: 16px; margin: 0 0 4px; }
    .sub strong { font-weight: 800; }
    .btn {
      display: inline-block;
      padding: 18px 34px;
      margin-top: 18px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
    }
    .hint { margin-top: 10px; font-size: 13px; color: #666; line-height: 1.35; }
    .debug {
      margin-top: 16px;
      font-size: 12px;
      color: #222;
      word-break: break-all;
      text-align: left;
      background: #f7f7f7;
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      border: 1px solid #eee;
    }
    .small { font-size: 12px; color: #666; margin-top: 10px; }
  </style>
</head>

<body>

<div class="card">
  <div class="title">✅ Verify Before Printing</div>

  <p class="sub"><strong>Name:</strong> <span id="patientName">—</span></p>
  <p class="sub"><strong>DOB:</strong> <span id="patientDob">—</span></p>
  <p class="sub"><strong>Labels:</strong> <span id="labelCount">—</span></p>

  <a id="printBtn" href="#" class="btn">Tap to Print</a>

  <div class="hint" id="hintText">
    If Mobiprint does not open automatically, tap again.
  </div>

  <div id="debugText" class="debug">Initializing...</div>

  <div class="small">
    (This page does not send patient data to the server — hash (#) is processed locally.)
  </div>
</div>

<script>
/* ============================
   Helpers
============================ */

function getParamFromHash(key) {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get(key) || "";
}

function sanitizeZpl(zpl) {
  zpl = zpl.replace(/^\uFEFF/, "");
  zpl = zpl.replace(/\u00A0/g, " ");
  zpl = zpl.replace(/[^\x00-\x7F]/g, "");
  return zpl.trim();
}

function debugHex(str) {
  return Array.from(str.slice(0, 40))
    .map(c => c.charCodeAt(0).toString(16).padStart(2,'0'))
    .join(" ");
}

/**
 * Build one label (patient name + DOB + barcode)
 * Add ^PQ per label (qty) when qty > 1
 */
function buildSingleLabelZpl(name, dob, barcode, qty) {
  qty = parseInt(qty || "1", 10);
  if (!qty || qty < 1) qty = 1;

  let zpl = `^XA
^PW406
^LL300
^FO20,20^A0N,32,32^FD${name}^FS
^FO20,60^A0N,28,28^FDDOB: ${dob}^FS
^FO20,110^BY2,2,80^BCN,80,Y,N,N^FD${barcode}^FS`;

  if (qty > 1) zpl += `\n^PQ${qty},0,1,Y`;

  zpl += `\n^XZ`;
  return zpl;
}

/**
 * items format:
 *   items=BARCODE*QTY|BARCODE*QTY|BARCODE
 * qty optional defaults to 1
 * Example:
 *   items=111*1|222*3|333*2
 */
function parseItems(itemsStr) {
  const decoded = decodeURIComponent(itemsStr || "").trim();
  if (!decoded) return [];

  return decoded.split("|").map(part => {
    let [barcode, qty] = part.split("*");
    barcode = (barcode || "").trim();
    qty = (qty || "1").trim();
    if (!barcode) return null;
    return { barcode, qty };
  }).filter(Boolean);
}

/* ============================
   State
============================ */

let mobiprintDeepLink = "";
let callbackUrl = "asana://";
let patientName = "";
let patientDob = "";
let zplPreview = "";

/* ============================
   Build job from hash
============================ */

function buildPrintJobFromHash() {
  // Reset display
  document.getElementById("patientName").innerText = "—";
  document.getElementById("patientDob").innerText = "—";
  document.getElementById("labelCount").innerText = "—";

  document.getElementById("debugText").innerText = "Processing hash...";
  document.getElementById("printBtn").href = "#";

  // Inputs
  callbackUrl = getParamFromHash("cb") || "asana://";

  const nameParam = getParamFromHash("name");
  const dobParam  = getParamFromHash("dob");
  const itemsParam = getParamFromHash("items");

  if (!nameParam || !dobParam || !itemsParam) {
    document.getElementById("debugText").innerText =
      "❌ Missing required parameters.\n\n" +
      "Expected hash format:\n" +
      "#name=...&dob=...&items=111*1|222*3|333*2&cb=asana://\n\n" +
      "Example:\n" +
      "#name=TEST%20PATIENT%20A&dob=02%2F02%2F1992&items=1111111111*1%7C2222222222*3%7C3333333333*2&cb=asana://";
    return false;
  }

  patientName = decodeURIComponent(nameParam);
  patientDob  = decodeURIComponent(dobParam);

  const items = parseItems(itemsParam);

  if (!items.length) {
    document.getElementById("debugText").innerText =
      "❌ items parameter invalid or empty.\n\n" +
      "Valid example:\nitems=1111111111*1|2222222222*3|3333333333*2";
    return false;
  }

  // Display verification
  document.getElementById("patientName").innerText = patientName;
  document.getElementById("patientDob").innerText = patientDob;

  // Count total labels including qty
  const totalLabels = items.reduce((sum, it) => sum + Math.max(1, parseInt(it.qty || "1", 10) || 1), 0);
  document.getElementById("labelCount").innerText =
    `${items.length} barcode(s) / ${totalLabels} label(s) total`;

  // Build ZPL job
  let finalZpl = items.map(it => buildSingleLabelZpl(patientName, patientDob, it.barcode, it.qty)).join("\r\n") + "\r\n";
  finalZpl = sanitizeZpl(finalZpl) + "\r\n";
  zplPreview = finalZpl;

  // Base64 encode job
  const base64Zpl = btoa(finalZpl);

  // Build deep link
  mobiprintDeepLink =
    "arrowhead://x-callback-url/zplcode" +
    "?code=" + encodeURIComponent(base64Zpl) +
    "&x-success=" + encodeURIComponent(callbackUrl) +
    "&x-error=" + encodeURIComponent(callbackUrl) +
    "&x-cancel=" + encodeURIComponent(callbackUrl);

  // Set print button href (useful for long-press/copy too)
  document.getElementById("printBtn").href = mobiprintDeepLink;

  // Debug output
  document.getElementById("debugText").innerText =
    "✅ Parsed inputs\n\n" +
    "Name: " + patientName + "\n" +
    "DOB: " + patientDob + "\n" +
    "Callback: " + callbackUrl + "\n\n" +
    "✅ ZPL Preview (first 300 chars):\n" + finalZpl.slice(0, 300) + "...\n\n" +
    "✅ HEX (first 40 chars):\n" + debugHex(finalZpl) + "\n\n" +
    "✅ Deep Link:\n" + mobiprintDeepLink;

  return true;
}

/* ============================
   Print action (must be user gesture)
============================ */

function onTapToPrint(e) {
  e.preventDefault();

  // If link wasn't built, try again
  if (!mobiprintDeepLink) {
    const ok = buildPrintJobFromHash();
    if (!ok) return;
  }

  // Launch Mobiprint (user gesture)
  window.location.href = mobiprintDeepLink;

  // Clear PHI from address bar shortly after tap
  setTimeout(() => {
    history.replaceState(null, "", window.location.pathname);
  }, 700);

  // Best-effort return to Asana even if x-success fails
  // (Don't make it too fast or it interrupts the app open)
  setTimeout(() => {
    window.location.href = callbackUrl;
  }, 2200);
}

/* ============================
   Setup
============================ */

function init() {
  const ok = buildPrintJobFromHash();

  // Attach tap handler
  document.getElementById("printBtn").onclick = onTapToPrint;

  // If ok, update title
  if (ok) {
    document.title = "Ready to Print";
  } else {
    document.title = "SMS Print";
  }
}

// Run on load AND on hash change so Safari tab reuse prints correct new info
window.onload = init;
window.onhashchange = init;
</script>

</body>
</html>
