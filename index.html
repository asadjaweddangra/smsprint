<!DOCTYPE html>
<html>
<head>
  <title>SMS Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 28px 16px; background: #fff; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .title { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
    .sub { font-size: 16px; margin: 0 0 6px; text-align:left; }
    .sub strong { font-weight: 800; }
    .btn { display:inline-block; padding:18px 34px; margin-top:16px; background:#28a745; color:#fff; text-decoration:none; border-radius:12px; font-size:20px; font-weight:800; }
    .debug { margin-top:16px; font-size:12px; color:#222; word-break:break-all; text-align:left; background:#f7f7f7; padding:14px; border-radius:12px; white-space:pre-wrap; border:1px solid #eee; }
  </style>
</head>
<body>
<div class="card">
  <div class="title">✅ Verify Before Printing</div>

  <div class="sub"><strong>Name:</strong> <span id="patientName">—</span></div>
  <div class="sub"><strong>DOB:</strong> <span id="patientDob">—</span></div>
  <div class="sub"><strong>Will print:</strong><br><span id="labelList">—</span></div>
  <div class="sub"><strong>Total labels:</strong> <span id="totalLabels">—</span></div>

  <a id="printBtn" class="btn" href="#">Tap to Print</a>

  <div id="debugText" class="debug">Initializing...</div>
</div>

<script>
function getParamFromHash(key) {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get(key) || "";
}

function parseItems(itemsStr) {
  const decoded = decodeURIComponent(itemsStr || "").trim();
  if (!decoded) return [];
  return decoded.split("|").map(part => {
    let [barcode, qty] = part.split("*");
    barcode = (barcode || "").trim();
    qty = (qty || "1").trim();
    if (!barcode) return null;
    return { barcode, qty: String(parseInt(qty,10) || 1) };
  }).filter(Boolean);
}

function sanitizeZpl(zpl) {
  zpl = zpl.replace(/^\uFEFF/, "");
  zpl = zpl.replace(/\u00A0/g, " ");
  zpl = zpl.replace(/[^\x00-\x7F]/g, "");
  return zpl.trim();
}

/**
 * ✅ Tighter layout: barcode moved closer to name
 * Name: y=18
 * DOB:  y=48
 * Barcode: y=78
 * Barcode height reduced to 70
 */
function buildSingleLabelZpl(name, dob, barcode, qty) {
  qty = parseInt(qty || "1", 10);
  if (!qty || qty < 1) qty = 1;

  let zpl = `^XA
^MMT
^MNW
^PR6
^PW406
^LL300
^FO20,18^A0N,32,32^FD${name}^FS
^FO20,48^A0N,26,26^FDDOB: ${dob}^FS
^FO20,78^BY2,2,70^BCN,70,Y,N,N^FD${barcode}^FS`;

  if (qty > 1) zpl += `\n^PQ${qty},0,1,Y`;

  zpl += `\n^XZ\r\n`;
  return zpl;
}

// MobiPrint Android web integration: replace '=' with '_' in base64
function mobiprintBase64(zpl) {
  let b64 = btoa(zpl);
  return b64.replace(/=/g, "_");
}

function buildLinkForPlatform(codeB64, cb) {
  const isAndroid = /Android/i.test(navigator.userAgent);

  const qs =
    "x-callback-url/zplcode?code=" + encodeURIComponent(codeB64) +
    "&x-success=" + encodeURIComponent(cb) +
    "&x-error=" + encodeURIComponent(cb) +
    "&x-cancel=" + encodeURIComponent(cb);

  if (isAndroid) {
    // Most reliable Android launch:
    const pkg = "com.mobiprintpro.retail.android";
    return "intent://" + qs + "#Intent;scheme=arrowhead;package=" + pkg + ";end";
  }

  return "arrowhead://" + qs;
}

let deepLink = "";
let callbackUrl = "asana://";
let androidReturnArmed = false;

function init() {
  const nameParam = getParamFromHash("name");
  const dobParam  = getParamFromHash("dob");
  const itemsParam = getParamFromHash("items");
  callbackUrl = getParamFromHash("cb") || "asana://";

  if (!nameParam || !dobParam || !itemsParam) {
    document.getElementById("debugText").innerText =
      "❌ Missing required params.\n\nUse:\n" +
      "#name=...&dob=...&items=111*1|222*3&cb=asana://";
    return;
  }

  const name = decodeURIComponent(nameParam);
  const dob  = decodeURIComponent(dobParam);
  const items = parseItems(itemsParam);

  document.getElementById("patientName").innerText = name;
  document.getElementById("patientDob").innerText = dob;

  const listLines = items.map((it,i)=>`${i+1}) ${it.barcode}  x${it.qty}`).join("\n");
  document.getElementById("labelList").innerText = listLines;

  const total = items.reduce((s,it)=> s + Math.max(1, parseInt(it.qty,10)||1), 0);
  document.getElementById("totalLabels").innerText = String(total);

  let finalZpl = items.map(it => buildSingleLabelZpl(name, dob, it.barcode, it.qty)).join("");
  finalZpl = sanitizeZpl(finalZpl) + "\r\n";

  const codeB64 = mobiprintBase64(finalZpl);
  deepLink = buildLinkForPlatform(codeB64, callbackUrl);

  document.getElementById("printBtn").href = deepLink;

  document.getElementById("debugText").innerText =
    "✅ UA:\n" + navigator.userAgent + "\n\n" +
    "✅ Callback:\n" + callbackUrl + "\n\n" +
    "✅ Base64 length:\n" + codeB64.length + "\n\n" +
    "✅ Deep link:\n" + deepLink + "\n\n" +
    "✅ ZPL tail (last 140 chars):\n" + finalZpl.slice(-140);
}

// ✅ When user returns to browser on Android, jump to Asana
document.addEventListener("visibilitychange", () => {
  const isAndroid = /Android/i.test(navigator.userAgent);
  if (isAndroid && androidReturnArmed && !document.hidden) {
    window.location.href = callbackUrl;
  }
});

document.getElementById("printBtn").onclick = function() {
  // Clear PHI quickly
  setTimeout(() => {
    history.replaceState(null, "", window.location.pathname);
  }, 400);

  // Arm Android return: when user comes back to browser, send them to Asana
  if (/Android/i.test(navigator.userAgent)) {
    androidReturnArmed = true;

    // Optional timed return fallback (in case user doesn't return)
    setTimeout(() => {
      // Only do this if they’re still on this page (not hidden)
      if (!document.hidden) window.location.href = callbackUrl;
    }, 6000);
  }
};

window.onload = init;
window.onhashchange = init;
</script>
</body>
</html>
