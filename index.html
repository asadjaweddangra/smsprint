<!DOCTYPE html>
<html>
<head>
  <title>Specimen Collection Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px 16px; background: #f4f7f6; color: #111; }
    .card { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    
    #printView { display: block; }
    #confirmView { display: none; }

    .title { font-size: 22px; font-weight: 800; margin-bottom: 15px; }
    .patient-box { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: left; margin-bottom: 20px; border-left: 5px solid #007bff; }
    
    .labelPreview { margin-top: 8px; text-align: left; }
    .labelRow { border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-top: 10px; background: #fff; position: relative; overflow: hidden; }
    .labelRow.sendout::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #000; }
    .labelMetaTop { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .labelTag { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; background:#f2f2f2; }
    .labelTag.so { background:#000; color:#fff; }
    .labelTag.ih { background:#e9f7ee; color:#1f7a39; border:1px solid #bfe8cc; }
    .barcodeLine { font-size: 16px; font-weight: 900; letter-spacing: 0.3px; }
    .testsLine { margin-top: 6px; font-size: 13px; color:#111; line-height: 1.2; }
    
    .btn { display: block; width: 100%; padding: 18px; margin-top: 12px; border-radius: 12px; font-size: 18px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; box-sizing: border-box; }
    .btn-print { background: #007bff; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-warn { background: #ffc107; color: #111; }
    .btn-danger { background: #dc3545; color: white; }
    
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#eee; font-size:10px; font-weight:700; margin-bottom:10px; text-transform: uppercase; }
    .debug { margin-top: 20px; font-size: 11px; color: #888; text-align: left; background: #eee; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="card">
  <div id="platformPill" class="pill">Detecting...</div>

  <div id="printView">
    <div class="title">1. Verify & Print</div>
    <div class="patient-box">
      <strong>Patient:</strong> <span id="name">—</span><br>
      <strong>DOB:</strong> <span id="dob">—</span>
    </div>
    <div class="labelPreview" id="labelPreview">Preparing labels...</div>
    <button id="printBtn" class="btn btn-print">🖨️ Print Labels</button>
  </div>

  <div id="confirmView">
    <div class="title">2. Collection Status</div>
    <p style="font-size: 14px; color: #555;">Labels sent to printer. Attach labels to tubes, then confirm:</p>
    <button onclick="handleOutcome('SUCCESS')" class="btn btn-success">✅ Yes, Collection Complete</button>
    <button onclick="handleOutcome('HANDWRITE')" class="btn btn-warn">✍️ Printer Failed (Hand-write)</button>
    <button onclick="handleOutcome('REFUSED')" class="btn btn-danger">❌ Unable to Draw / Refused</button>
    <button onclick="resetWorkflow()" style="background:none; border:none; color:#007bff; margin-top:15px; cursor:pointer; font-weight:bold;">← Reprint Labels</button>
  </div>

  <div id="debug" class="debug">System Ready.</div>
</div>

<script>
/* ============================================================
   CONFIGURATION
   ============================================================ */
const ANDROID_MODE = "ARROWHEAD"; 
const IOS_MODE     = "SHORTCUT"; 

const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/i.test(navigator.userAgent);
const isWindows = () => /Win/.test(navigator.platform);

let patientData = {};
let finalZpl = "";

function init() {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    
    const os = isIOS() ? "iOS" : (isAndroid() ? "Android" : (isWindows() ? "Windows" : "Unknown"));
    document.getElementById("platformPill").innerText = `${os} Mode: ${isIOS() ? IOS_MODE : ANDROID_MODE}`;

    patientData = {
        name: decodeURIComponent(params.get("name") || ""),
        dob: decodeURIComponent(params.get("dob") || ""),
        items: decodeURIComponent(params.get("items") || "").split("|"),
        label: decodeURIComponent(params.get("label") || "").split("|"),
        tests: decodeURIComponent(params.get("tests") || "").split("|"),
        st: decodeURIComponent(params.get("st") || "").split("|"),
        cb: params.get("cb") || "asana://"
    };

    if(!patientData.name || !patientData.items[0]) {
        document.getElementById("labelPreview").innerText = "Error: Missing Patient Data";
        return;
    }

    document.getElementById("name").innerText = patientData.name;
    document.getElementById("dob").innerText = patientData.dob;
    renderLabels();

    document.getElementById("printBtn").onclick = () => {
        // 1. Switch UI First (So if the app crashes, the user is already on step 2)
        document.getElementById("printView").style.display = "none";
        document.getElementById("confirmView").style.display = "block";
        
        // 2. Execute Print
        executePrint();
    };
}

function renderLabels() {
    let uiHtml = "";
    finalZpl = "";
    patientData.items.forEach((item, i) => {
        if (!item) return;
        let [bc, qty] = item.split("*");
        qty = parseInt(qty) || 1;
        const lblType = (patientData.label[i] || "IH").toUpperCase();
        const tst = patientData.tests[i] || "";
        const stype = patientData.st[i] || "";
        const isSO = lblType === "SO";

        uiHtml += `<div class="labelRow ${isSO ? 'sendout' : ''}">
                <div class="labelMetaTop">
                    <span class="labelTag ${isSO ? 'so' : 'ih'}">${isSO ? 'SO' : 'IH'}</span>
                    <span style="font-size:11px; font-weight:700; color:#666;">QTY: ${qty}</span>
                </div>
                <div class="barcodeLine">${bc}</div>
                <div class="testsLine"><strong>${stype}</strong> - ${tst}</div>
            </div>`;
        
        const border = isSO ? 15 : 0;
        finalZpl += `^XA^MMT^MNM^PR6^MD30^FO0,10^GB385,${border},${border}^FS`;
        finalZpl += `^FO20,25^A0N,32,32^FD${patientData.name.substring(0,25)}^FS`;
        finalZpl += `^FO20,55^A0N,28,28^FD${patientData.dob}^FS`;
        finalZpl += `^FO20,78^BY2,2,80^BCN,80,Y,N,N^FD${bc}^FS`;
        finalZpl += `^FO12,180^A0N,20,20^FD${stype.substring(0,30)}^FS`;
        finalZpl += `^FO12,200^A0N,20,20^FB350,2,0,L,0^FD${tst.substring(0,60)}^FS`;
        finalZpl += `^PQ${qty},0,1,Y^XZ\r\n`;
    });
    document.getElementById("labelPreview").innerHTML = uiHtml;
}

function executePrint() {
    const cleanZpl = finalZpl.replace(/[^\x00-\x7F]/g, ""); 
    const b64 = btoa(cleanZpl).replace(/=/g, "_");
    
    // We send a simplified return URL to avoid iOS buffer limits
    const returnUrl = window.location.origin + window.location.pathname + window.location.hash;

    if (isWindows()) {
        printViaSerial(finalZpl);
    } 
    else if (isAndroid()) {
        if (ANDROID_MODE === "ARROWHEAD") {
            window.location.href = `intent://x-callback-url/zplcode?code=${b64}&x-success=${encodeURIComponent(returnUrl)}#Intent;scheme=arrowhead;package=com.mobiprintpro.retail.android;end`;
        } else {
            window.location.href = "shortcuts://run-shortcut?name=SMS-Print&text=" + encodeURIComponent(window.location.hash.substring(1));
        }
    } 
    else if (isIOS()) {
        if (IOS_MODE === "ARROWHEAD") {
            // Updated iOS Arrowhead string with explicit success callback
            const iosLink = `arrowhead://x-callback-url/zplcode?code=${encodeURIComponent(b64)}&x-success=${encodeURIComponent(returnUrl)}&x-source=Browser`;
            window.location.href = iosLink;
        } else {
            window.location.href = "shortcuts://run-shortcut?name=SMSPrint&input=text&text=" + encodeURIComponent(window.location.hash.substring(1));
        }
    }
}

function resetWorkflow() {
    document.getElementById("confirmView").style.display = "none";
    document.getElementById("printView").style.display = "block";
}

function handleOutcome(status) {
    const cb = patientData.cb;
    if (status === 'SUCCESS') {
        window.location.href = cb;
    } else if (status === 'HANDWRITE') {
        const separator = cb.includes('?') ? '&' : '?';
        window.location.href = `${cb}${separator}status=handwritten`;
    } else {
        window.location.href = "asana://";
    }
}

async function printViaSerial(zpl) {
    try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        const writer = port.writable.getWriter();
        await writer.write(new TextEncoder().encode(zpl));
        writer.releaseLock();
        await port.close();
    } catch (e) { document.getElementById("debug").innerText = "Serial Error: " + e.message; }
}

window.onload = init;
</script>
</body>
</html>
