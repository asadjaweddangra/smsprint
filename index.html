<!DOCTYPE html>
<html>
<head>
  <title>SMS Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 28px 16px; background: #fff; }
    .card { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .title { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
    .sub { font-size: 16px; margin: 0 0 6px; text-align:left; }
    .sub strong { font-weight: 800; }
    .btn { display:inline-block; padding:18px 34px; margin-top:16px; background:#28a745; color:#fff; text-decoration:none; border-radius:12px; font-size:20px; font-weight:800; }
    .btnSecondary { display:inline-block; padding:14px 22px; margin-top:10px; background:#111; color:#fff; text-decoration:none; border-radius:12px; font-size:15px; font-weight:800; }
    .debug { margin-top:16px; font-size:12px; color:#222; word-break:break-all; text-align:left; background:#f7f7f7; padding:14px; border-radius:12px; white-space:pre-wrap; border:1px solid #eee; }
    .hint { margin-top:10px; font-size:12px; color:#666; text-align:left; line-height:1.35; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#eee; font-size:12px; font-weight:700; margin-bottom:10px; }
  </style>
</head>

<body>
<div class="card">
  <div class="pill" id="platformPill">Detecting platform…</div>
  <div class="title">✅ Verify Before Printing</div>

  <div class="sub"><strong>Name:</strong> <span id="patientName">—</span></div>
  <div class="sub"><strong>DOB:</strong> <span id="patientDob">—</span></div>
  <div class="sub"><strong>Will print:</strong><br><span id="labelList">—</span></div>
  <div class="sub"><strong>Total labels:</strong> <span id="totalLabels">—</span></div>

  <a id="printBtn" class="btn" href="#">Tap to Print</a><br>
  <a id="backBtn" class="btnSecondary" href="#" style="display:none;">Back to Asana & Close Tab</a>

  <div class="hint" id="hintText"></div>

  <div id="debugText" class="debug">Initializing...</div>
</div>

<script>
/* ============================
   Helpers
============================ */
function getParamFromHash(key) {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get(key) || "";
}

function parseItems(itemsStr) {
  const decoded = decodeURIComponent(itemsStr || "").trim();
  if (!decoded) return [];
  return decoded.split("|").map(part => {
    let [barcode, qty] = part.split("*");
    barcode = (barcode || "").trim();
    qty = (qty || "1").trim();
    if (!barcode) return null;
    return { barcode, qty: String(parseInt(qty,10) || 1) };
  }).filter(Boolean);
}

/* ============================
   Platform detection
============================ */
function isIOS() {
  return (
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
  );
}

function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}

/* ============================
   Android: Build MobiPrint link
============================ */

// ZPL: tighter layout (barcode closer to name)
function buildSingleLabelZpl(name, dob, barcode, qty) {
  qty = parseInt(qty || "1", 10);
  if (!qty || qty < 1) qty = 1;

  let zpl = `^XA
^MMT
^MNW
^PR6
^PW406
^LL300
^FO20,18^A0N,32,32^FD${name}^FS
^FO20,48^A0N,26,26^FDDOB: ${dob}^FS
^FO20,78^BY2,2,70^BCN,70,Y,N,N^FD${barcode}^FS`;

  if (qty > 1) zpl += `\n^PQ${qty},0,1,Y`;

  // critical separator for multi-label
  zpl += `\n^XZ\r\n`;
  return zpl;
}

function sanitizeZpl(zpl) {
  zpl = zpl.replace(/^\uFEFF/, "");
  zpl = zpl.replace(/\u00A0/g, " ");
  zpl = zpl.replace(/[^\x00-\x7F]/g, "");
  return zpl.trim();
}

// Vendor behavior for Android: Base64 then replace '=' with '_' (MobiPrint web pattern)
function mobiprintBase64(zpl) {
  let b64 = btoa(zpl);
  return b64.replace(/=/g, "_");
}

function buildAndroidMobiPrintIntent(codeB64, cb) {
  const qs =
    "x-callback-url/zplcode?code=" + encodeURIComponent(codeB64) +
    "&x-success=" + encodeURIComponent(cb) +
    "&x-error=" + encodeURIComponent(cb) +
    "&x-cancel=" + encodeURIComponent(cb);

  // Android intent launch (reliable)
  const pkg = "com.mobiprintpro.retail.android";
  return "intent://" + qs + "#Intent;scheme=arrowhead;package=" + pkg + ";end";
}

/* ============================
   iOS: Build Shortcut link
============================ */
function buildIOSShortcutURL(name, dob, itemsDecoded, cb) {
  const shortcutName = "SMS Print"; // must match shortcut exactly
  const payload =
    `name=${encodeURIComponent(name)}` +
    `&dob=${encodeURIComponent(dob)}` +
    `&items=${encodeURIComponent(itemsDecoded)}` +
    `&cb=${encodeURIComponent(cb)}`;

  return "shortcuts://run-shortcut" +
    "?name=" + encodeURIComponent(shortcutName) +
    "&input=text" +
    "&text=" + encodeURIComponent(payload);
}

/* ============================
   Android: Return to Asana + try close
============================ */
function asanaIntentAndroid() {
  return "intent://#Intent;scheme=asana;package=com.asana.app;end";
}

function goToAsanaAndTryClose() {
  window.location.href = asanaIntentAndroid();
  setTimeout(() => { window.close(); }, 150);
}

/* ============================
   Main
============================ */
let deepLink = "";
let callbackUrl = "asana://";
let autoReturnTimer = null;
let platform = "unknown";

function init() {
  platform = isIOS() ? "iOS" : (isAndroid() ? "Android" : "Other");
  document.getElementById("platformPill").innerText = platform;

  const nameParam = getParamFromHash("name");
  const dobParam  = getParamFromHash("dob");
  const itemsParam = getParamFromHash("items");
  callbackUrl = getParamFromHash("cb") || "asana://";

  if (!nameParam || !dobParam || !itemsParam) {
    document.getElementById("debugText").innerText =
      "❌ Missing required params.\n\nUse:\n" +
      "#name=...&dob=...&items=111*1|222*3&cb=asana://\n\nExample:\n" +
      "#name=TEST%20PATIENT&dob=01%2F01%2F1990&items=50019363P1*1%7C50019363S1*1";
    return;
  }

  const name = decodeURIComponent(nameParam);
  const dob  = decodeURIComponent(dobParam);
  const items = parseItems(itemsParam);

  document.getElementById("patientName").innerText = name;
  document.getElementById("patientDob").innerText = dob;

  const listLines = items.map((it,i)=>`${i+1}) ${it.barcode}  x${it.qty}`).join("\n");
  document.getElementById("labelList").innerText = listLines;

  const total = items.reduce((s,it)=> s + Math.max(1, parseInt(it.qty,10)||1), 0);
  document.getElementById("totalLabels").innerText = String(total);

  const itemsDecoded = decodeURIComponent(itemsParam);

  // iOS → Shortcut-only (no Mobiprint prompt most of the time)
  if (isIOS()) {
    deepLink = buildIOSShortcutURL(name, dob, itemsDecoded, callbackUrl);
    document.getElementById("printBtn").href = deepLink;
    document.getElementById("backBtn").style.display = "none";
    document.getElementById("hintText").innerText =
      "iPhone: This will run the iOS Shortcut “SMS Print”. The Shortcut prints and returns to Asana.";
  }

  // Android → MobiPrint intent + auto-return to Asana + try close
  else if (isAndroid()) {
    let finalZpl = items.map(it => buildSingleLabelZpl(name, dob, it.barcode, it.qty)).join("");
    finalZpl = sanitizeZpl(finalZpl) + "\r\n";
    const codeB64 = mobiprintBase64(finalZpl);

    deepLink = buildAndroidMobiPrintIntent(codeB64, callbackUrl);
    document.getElementById("printBtn").href = deepLink;

    document.getElementById("backBtn").style.display = "inline-block";
    document.getElementById("hintText").innerText =
      "Android: MobiPrint may open as a floating window. This page will auto-return to Asana after you tap Print.";

    // Debug
    document.getElementById("debugText").innerText =
      "✅ Platform: Android\n\n" +
      "✅ Asana return intent:\n" + asanaIntentAndroid() + "\n\n" +
      "✅ Base64 length:\n" + codeB64.length + "\n\n" +
      "✅ MobiPrint intent:\n" + deepLink + "\n\n" +
      "✅ ZPL tail (last 160 chars):\n" + finalZpl.slice(-160);
    return; // stop here because we already set debug
  }

  else {
    deepLink = "javascript:void(0)";
    document.getElementById("printBtn").href = deepLink;
    document.getElementById("hintText").innerText =
      "Unsupported device. Use iPhone (Shortcut) or Android (MobiPrint).";
  }

  // Debug for iOS/Other
  document.getElementById("debugText").innerText =
    "✅ Platform: " + platform + "\n\n" +
    "✅ Callback param: " + callbackUrl + "\n\n" +
    "✅ Will print:\n" + listLines + "\n\n" +
    "✅ Deep link:\n" + deepLink;
}

/* ============================
   Click handlers
============================ */

// iOS: just clear PHI; Shortcut handles return to Asana
// Android: clear PHI and auto-return to Asana + close after timer
document.getElementById("printBtn").onclick = function() {
  setTimeout(() => {
    history.replaceState(null, "", window.location.pathname);
  }, 350);

  if (isAndroid()) {
    if (autoReturnTimer) clearTimeout(autoReturnTimer);
    autoReturnTimer = setTimeout(() => {
      goToAsanaAndTryClose();
    }, 3200);
  }
};

// Manual return for Android
document.getElementById("backBtn").onclick = function(e) {
  e.preventDefault();
  goToAsanaAndTryClose();
};

window.onload = init;
window.onhashchange = init;
</script>

</body>
</html>
