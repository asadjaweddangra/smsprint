<!DOCTYPE html>
<html>
<head>
  <title>SMS Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* UI STYLES (What you see on screen) */
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 28px 16px; background: #fff; }
    .card { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .title { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
    .sub { font-size: 16px; margin: 0 0 6px; text-align:left; }
    .sub strong { font-weight: 800; }
    .btn { display:inline-block; padding:18px 34px; margin-top:16px; background:#28a745; color:#fff; text-decoration:none; border-radius:12px; font-size:20px; font-weight:800; border:none; cursor:pointer; width: 100%; box-sizing: border-box; }
    .btnSecondary { display:inline-block; padding:14px 22px; margin-top:10px; background:#111; color:#fff; text-decoration:none; border-radius:12px; font-size:15px; font-weight:800; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#eee; font-size:12px; font-weight:700; margin-bottom:10px; }
    
    /* Label Preview Row */
    .labelRow { border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-top: 10px; text-align: left; position: relative; overflow: hidden; }
    .labelRow.sendout::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #000; }
    .barcodeLine { font-size: 16px; font-weight: 900; }

    /* PRINT STYLES (What the printer sees) */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
      .print-page { 
        width: 3in; height: 1in; /* ADJUST TO YOUR LABEL SIZE */
        page-break-after: always; 
        padding: 5px;
        box-sizing: border-box;
        border: none;
        text-align: left;
      }
      .print-so-bar { height: 12px; background: black !important; -webkit-print-color-adjust: exact; margin-bottom: 4px; }
      .print-name { font-size: 12pt; font-weight: bold; margin: 0; }
      .print-dob { font-size: 10pt; margin: 0; }
      .print-barcode { font-size: 14pt; font-weight: bold; margin: 4px 0; font-family: monospace; }
      .print-tests { font-size: 8pt; line-height: 1.1; }
    }
  </style>
</head>

<body>
<div class="card">
  <div id="platformPill" class="pill">Detecting platform…</div>
  <div class="title">✅ Verify & Print</div>

  <div class="sub"><strong>Name:</strong> <span id="patientName">—</span></div>
  <div class="sub"><strong>DOB:</strong> <span id="patientDob">—</span></div>
  <div id="labelPreview"></div>

  <button id="printBtn" class="btn">Print Labels</button><br>
  <a id="backBtn" class="btnSecondary" href="#" style="display:none;">Back to Asana</a>
</div>

<div id="printArea"></div>

<script>
const isWindows = () => /Win/i.test(navigator.platform);
const isAndroid = () => /Android/i.test(navigator.userAgent);

function getParam(key) {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get(key) || "";
}

function init() {
  const name = decodeURIComponent(getParam("name"));
  const dob = decodeURIComponent(getParam("dob"));
  const itemsStr = decodeURIComponent(getParam("items"));
  const labels = decodeURIComponent(getParam("label")).split("|");
  const tests = decodeURIComponent(getParam("tests")).split("|");
  const st = decodeURIComponent(getParam("st")).split("|");

  document.getElementById("patientName").innerText = name;
  document.getElementById("patientDob").innerText = dob;

  const itemParts = itemsStr.split("|");
  const printArea = document.getElementById("printArea");
  let previewHtml = "";

  itemParts.forEach((part, i) => {
    let [bc, qty] = part.split("*");
    qty = parseInt(qty) || 1;
    const isSO = (labels[i] || "").toUpperCase() === "SO";

    // 1. Build the UI Preview
    previewHtml += `<div class="labelRow ${isSO ? 'sendout' : ''}">
      <div class="barcodeLine">${bc} x${qty}</div>
      <div style="font-size:12px;">${st[i] || ''} - ${tests[i] || ''}</div>
    </div>`;

    // 2. Build the System Print Pages
    for(let q=0; q < qty; q++) {
      const page = document.createElement("div");
      page.className = "print-page";
      page.innerHTML = `
        ${isSO ? '<div class="print-so-bar"></div>' : ''}
        <div class="print-name">${name}</div>
        <div class="print-dob">DOB: ${dob}</div>
        <div class="print-barcode">${bc}</div>
        <div class="print-tests">${st[i] || ''}<br>${tests[i] || ''}</div>
      `;
      printArea.appendChild(page);
    }
  });

  document.getElementById("labelPreview").innerHTML = previewHtml;

  const btn = document.getElementById("printBtn");
  if (isWindows()) {
    document.getElementById("platformPill").innerText = "Windows System Print";
    btn.onclick = () => window.print(); // Triggers System Print
  } else if (isAndroid()) {
    document.getElementById("platformPill").innerText = "Android (MobiPrint)";
    // ... Android ZPL/Intent Logic here
  }
}

window.onload = init;
</script>
</body>
</html>
