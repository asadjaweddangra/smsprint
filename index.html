<!DOCTYPE html>
<html>
<head>
  <title>SMS Specimen Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px 16px; background: #f4f7f6; color: #111; }
    .card { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    #printView, #confirmView { display: none; }
    .title { font-size: 22px; font-weight: 800; margin-bottom: 15px; }
    .patient-box { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: left; margin-bottom: 20px; border-left: 5px solid #007bff; }
    
    /* SYNCED CHECKLIST STYLES */
    .labelRow { border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-top: 10px; background: #fff; position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; transition: background 0.1s; }
    .labelRow:hover { background: #fafafa; }
    .labelRow.sendout::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #000; }
    
    .cb-input { width: 26px; height: 26px; accent-color: #28a745; flex-shrink: 0; cursor: pointer; pointer-events: auto; }
    .labelContent { flex: 1; pointer-events: none; } /* Allows the row click to work better */
    
    .labelTag { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; background:#f2f2f2; margin-bottom: 4px;}
    .labelTag.so { background:#000; color:#fff; }
    .labelTag.ih { background:#e9f7ee; color:#1f7a39; border:1px solid #bfe8cc; }
    .barcodeLine { font-size: 15px; font-weight: 900; }
    .testsLine { font-size: 13px; color:#111; line-height: 1.2; }
    
    .btn { display: block; width: 100%; padding: 18px; margin-top: 12px; border-radius: 12px; font-size: 18px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; box-sizing: border-box; }
    .btn-print { background: #007bff; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-warn { background: #ffc107; color: #111; }
    .btn-danger { background: #dc3545; color: white; }
    
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#eee; font-size:10px; font-weight:700; margin-bottom:10px; text-transform: uppercase; }
    .debug { margin-top: 20px; font-size: 11px; color: #888; text-align: left; background: #eee; padding: 10px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>

<div class="card">
  <div id="platformPill" class="pill">Detecting...</div>

  <div id="printView" style="display:block;">
    <div class="title">1. Verify & Print</div>
    <div class="patient-box">
      <strong>Patient:</strong> <span id="name">—</span><br>
      <strong>DOB:</strong> <span id="dob">—</span>
    </div>
    <div id="labelPreview1"></div>
    <button id="printBtn" class="btn btn-print">🖨️ Print Labels</button>
  </div>

  <div id="confirmView">
    <div class="title">2. Final Collection</div>
    <div class="patient-box">
      <strong>Patient:</strong> <span id="name2">—</span><br>
      <strong>DOB:</strong> <span id="dob2">—</span>
    </div>
    <div class="patient-box" style="border-left-color: #28a745;">
        <strong>Confirm Samples Collected:</strong>
        <div id="labelPreview2"></div>
    </div>
    <button onclick="handleOutcome('SUCCESS')" class="btn btn-success">✅ Yes, Collected Checked</button>
    <button onclick="handleOutcome('HANDWRITE')" class="btn btn-warn">✍️ Printer Failed (Hand-write)</button>
    <button onclick="handleOutcome('REFUSED')" class="btn btn-danger">❌ Unable to Draw / Refused</button>
    <button onclick="resetWorkflow()" style="background:none; border:none; color:#007bff; margin-top:15px; cursor:pointer; font-weight:bold;">← Go Back / Reprint</button>
  </div>

  <div id="debug" class="debug">System Ready.</div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFK7SvlJZhAi33E2knw3TNkppdpQsk0PO4TOewm-N9ZIpGZx4GmZm8EwCVFK7dikrMzg/exec"; 
const IOS_MODE = "SHORTCUT"; // Options: "ARROWHEAD" or "SHORTCUT"
const ANDROID_MODE = "ARROWHEAD";

/* Windows: Zebra Browser Print local service.
   Default endpoint listens on http://localhost:9100.
   Install from: https://www.zebra.com/us/en/support-downloads/printer-software/printer-setup-utilities.html */
const BROWSER_PRINT_URL = "http://localhost:9100";

const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/i.test(navigator.userAgent);
const isDesktop = () => !isIOS() && !isAndroid();

let patientData = {};
let zplByIndex = {}; // per-item ZPL, keyed by item index — assembled at print time

/* Logic: Ignore index 0, Ignore last 2. Prefix SM2(FirstDigit)- */
function convertBarcodeToOrderCode(barcode) {
    if (!barcode || barcode.length < 5) return barcode;
    const firstDigit = barcode.charAt(0);
    const middlePart = barcode.substring(1, barcode.length - 2);
    return `SM2${firstDigit}-${middlePart}`;
}

function init() {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const rawItems = decodeURIComponent(params.get("items") || "");
    const firstBarcode = rawItems.split("|")[0].split("*")[0];

    document.getElementById("platformPill").innerText = isIOS() ? `iOS (${IOS_MODE})` : (isAndroid() ? "Android" : "Windows (Browser Print)");

    patientData = {
        name: decodeURIComponent(params.get("name") || ""),
        dob: decodeURIComponent(params.get("dob") || ""),
        order_code: convertBarcodeToOrderCode(firstBarcode),
        items: rawItems.split("|"),
        label: decodeURIComponent(params.get("label") || "").split("|"),
        tests: decodeURIComponent(params.get("tests") || "").split("|"),
        st: decodeURIComponent(params.get("st") || "").split("|"),
        cb: params.get("cb") || "asana://"
    };

    if(!patientData.name) return;
    document.getElementById("name").innerText = patientData.name;
    document.getElementById("dob").innerText = patientData.dob;
    document.getElementById("name2").innerText = patientData.name;
    document.getElementById("dob2").innerText = patientData.dob;
    
    renderLists();

    document.getElementById("printBtn").onclick = async () => {
        await executePrint();
        document.getElementById("printView").style.display = "none";
        document.getElementById("confirmView").style.display = "block";
        window.scrollTo(0,0);
    };
}

function renderLists() {
    let uiHtml = "";
    zplByIndex = {};
    patientData.items.forEach((item, i) => {
        if (!item) return;
        let [bc, qty] = item.split("*");
        const lblType = (patientData.label[i] || "IH").toUpperCase();
        const tst = patientData.tests[i] || "";
        const stype = patientData.st[i] || "";
        const isSO = lblType === "SO";

        // row helper
        const row = (suffix) => `
            <div class="labelRow ${isSO ? 'sendout' : ''}" onclick="toggleCheck(${i}, '${suffix}')">
                <input type="checkbox" class="cb-input" id="check-${suffix}-${i}" checked onclick="event.stopPropagation(); syncChecks(${i}, '${suffix}')"> 
                <div class="labelContent">
                    <span class="labelTag ${isSO ? 'so' : 'ih'}">${lblType}</span>
                    <div class="barcodeLine">${bc}</div>
                    <div class="testsLine"><strong>${stype}</strong><br>${tst}</div>
                </div>
            </div>`;
        
        uiHtml += row('v1');
        
        const border = isSO ? 15 : 0;
        zplByIndex[i] = `^XA^MMT^MNM^PR6^MD30^FO0,10^GB385,${border},${border}^FS^FO20,25^A0N,32,32^FD${patientData.name.substring(0,25)}^FS^FO20,55^A0N,28,28^FD${patientData.dob}^FS^FO20,78^BY2,2,80^BCN,80,Y,N,N^FD${bc}^FS^FO12,180^A0N,20,20^FD${stype.substring(0,30)}^FS^FO12,200^A0N,20,20^FB350,2,0,L,0^FD${tst.substring(0,60)}^FS^PQ${qty},0,1,Y^XZ\r\n`;
    });

    document.getElementById("labelPreview1").innerHTML = uiHtml;
    // Map same HTML to View 2 but change IDs and toggle function source
    document.getElementById("labelPreview2").innerHTML = uiHtml.replace(/check-v1-/g, 'check-v2-').replace(/toggleCheck\((.*), 'v1'\)/g, "toggleCheck($1, 'v2')").replace(/syncChecks\((.*), 'v1'\)/g, "syncChecks($1, 'v2')");
}

/* Build ZPL only for items checked in the print view (v1) */
function buildZplForChecked() {
    let zpl = "";
    let count = 0;
    patientData.items.forEach((item, i) => {
        if (!item) return;
        const cb = document.getElementById(`check-v1-${i}`);
        if (cb && cb.checked && zplByIndex[i]) {
            zpl += zplByIndex[i];
            count++;
        }
    });
    return { zpl, count };
}

function toggleCheck(index, source) {
    const cb = document.getElementById(`check-${source}-${index}`);
    cb.checked = !cb.checked;
    syncChecks(index, source);
}

function syncChecks(index, source) {
    const other = source === 'v1' ? 'v2' : 'v1';
    const val = document.getElementById(`check-${source}-${index}`).checked;
    document.getElementById(`check-${other}-${index}`).checked = val;
}

async function handleOutcome(status) {
    const debugDiv = document.getElementById("debug");
    let collected = [], missed = [];
    patientData.items.forEach((item, i) => {
        if (!item) return;
        const stype = patientData.st[i] || "Sample";
        if(document.getElementById(`check-v2-${i}`).checked) collected.push(stype);
        else missed.push(stype);
    });

    // DISPLAY ORDER CODE IN DEBUG
    debugDiv.innerText = `🔄 Syncing Order: ${patientData.order_code}\nOutcome: ${status}...`;

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            body: JSON.stringify({ 
                order_code: patientData.order_code, 
                outcome: status,
                collected: collected,
                missed: missed
            })
        });
        debugDiv.innerText = `✅ Asana Updated Successfully!\nOrder: ${patientData.order_code}`;
    } catch (e) { 
        debugDiv.innerText = `❌ Error updating Asana.\nOrder: ${patientData.order_code}\n${e.message}`; 
    }

    setTimeout(() => { 
        // On desktop, asana:// won't do anything useful — stay put.
        if (isDesktop()) return;
        window.location.href = (status === 'REFUSED') ? "asana://" : patientData.cb; 
    }, 1200);
}

async function executePrint() {
    const debugDiv = document.getElementById("debug");

    // Build ZPL from only the checked rows in the print view
    const { zpl: finalZpl, count } = buildZplForChecked();
    if (count === 0) {
        debugDiv.innerText = `⚠️ No labels selected — nothing sent to printer.`;
        return;
    }

    // ---------- ANDROID ----------
    if (isAndroid()) {
        const b64 = btoa(finalZpl.replace(/[^\x00-\x7F]/g, "")).replace(/=/g, "_");
        const returnUrl = window.location.href;
        window.location.href = `intent://x-callback-url/zplcode?code=${b64}&x-success=${encodeURIComponent(returnUrl)}#Intent;scheme=arrowhead;package=com.mobiprintpro.retail.android;end`;
        return;
    }

    // ---------- iOS ----------
    if (isIOS()) {
        const b64 = btoa(finalZpl.replace(/[^\x00-\x7F]/g, "")).replace(/=/g, "_");
        const returnUrl = window.location.href;
        if (IOS_MODE === "ARROWHEAD") {
            window.location.href = `arrowhead://x-callback-url/zplcode?code=${encodeURIComponent(b64)}&x-success=${encodeURIComponent(returnUrl)}`;
        } else {
            window.location.href = "shortcuts://run-shortcut?name=SMSPrint&input=text&text=" + encodeURIComponent(window.location.hash.substring(1));
        }
        return;
    }

    // ---------- WINDOWS / DESKTOP via Zebra Browser Print ----------
    debugDiv.innerText = `🖨️ Sending ${count} label(s) to Browser Print...`;
    try {
        // Find the default printer
        const dRes = await fetch(`${BROWSER_PRINT_URL}/default?type=printer`, { method: "GET" });
        if (!dRes.ok) throw new Error(`Browser Print not reachable (HTTP ${dRes.status})`);
        const printer = await dRes.json();
        if (!printer || !printer.uid) throw new Error("No default Zebra printer configured in Browser Print.");

        // Send the ZPL
        const wRes = await fetch(`${BROWSER_PRINT_URL}/write`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device: printer, data: finalZpl })
        });
        if (!wRes.ok) throw new Error(`Print failed (HTTP ${wRes.status})`);

        debugDiv.innerText = `✅ Sent ${count} label(s) to: ${printer.name || printer.uid}`;
    } catch (e) {
        debugDiv.innerText =
            `❌ Browser Print error: ${e.message}\n\n` +
            `Fix:\n` +
            `1. Install Zebra Browser Print (zebra.com → Support → Printer Software)\n` +
            `2. Make sure the service is running (system tray)\n` +
            `3. Set a default printer in Browser Print\n` +
            `4. If page is HTTPS, trust the Browser Print cert at https://localhost:9101`;
    }
}

function resetWorkflow() {
    document.getElementById("confirmView").style.display = "none";
    document.getElementById("printView").style.display = "block";
}

window.onload = init;
</script>
</body>
</html>
