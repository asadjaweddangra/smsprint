<!DOCTYPE html>
<html>
<head>
  <title>SMS Print - System Version</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* UI STYLES */
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background: #fff; }
    .card { max-width: 500px; margin: 0 auto; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    .btn { display:inline-block; padding:18px 34px; margin-top:16px; background:#007bff; color:#fff; text-decoration:none; border-radius:12px; font-size:20px; font-weight:800; border:none; cursor:pointer; width: 100%; }
    
    /* PREVIEW HIDDEN DURING PRINT */
    .labelRow { border: 1px solid #eee; padding: 12px; margin-top: 10px; text-align: left; border-radius: 8px; }

    /* PRINT LAYOUT (Matches Zebra 2x1 or 3x1 labels) */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
      .print-page { 
        width: 3in; height: 1in; /* ADJUST TO YOUR LABEL SIZE */
        page-break-after: always; 
        padding: 5px;
        box-sizing: border-box;
      }
      .print-name { font-size: 14pt; font-weight: bold; }
      .print-barcode { font-size: 16pt; font-family: 'Courier New', monospace; font-weight: bold; }
    }
  </style>
</head>
<body>
<div class="card">
  <h2>✅ Verify & Print</h2>
  <div id="patientInfo" style="text-align:left; margin-bottom:15px;">
    <strong>Name:</strong> <span id="pName"></span><br>
    <strong>DOB:</strong> <span id="pDob"></span>
  </div>
  <div id="uiPreview"></div>
  <button class="btn" onclick="window.print()">Open Windows Print Dialog</button>
</div>

<div id="printArea"></div>

<script>
  function init() {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const name = decodeURIComponent(params.get("name") || "Test Patient");
    const dob = decodeURIComponent(params.get("dob") || "01/01/1990");
    const items = (params.get("items") || "").split("|");

    document.getElementById("pName").innerText = name;
    document.getElementById("pDob").innerText = dob;

    const printArea = document.getElementById("printArea");
    items.forEach(item => {
      let [bc, qty] = item.split("*");
      qty = parseInt(qty) || 1;

      for(let i=0; i<qty; i++) {
        const page = document.createElement("div");
        page.className = "print-page";
        page.innerHTML = `
          <div class="print-name">${name}</div>
          <div>DOB: ${dob}</div>
          <div class="print-barcode">${bc}</div>
        `;
        printArea.appendChild(page);
      }
    });
  }
  window.onload = init;
</script>
</body>
</html>
